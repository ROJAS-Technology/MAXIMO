<style>

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

body {
    background-color: #f0f0f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── Cabecera ─────────────────────────────────── */
.main-header {
    background-color: #556B2F;
    color: #ffffff;
    text-align: center;
    padding: 16px 0;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.main-header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
}

/* ── Barra azul ───────────────────────────────── */
.info-bar {
    background-color: #0056b3;
    color: #fff;
    text-align: center;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
}

/* ── Contenedor ───────────────────────────────── */
.ide-container {
    display: flex;
    flex: 1;
    padding: 14px;
    gap: 14px;
    min-height: 0;
    overflow: hidden;
}

/* ── Panel izquierdo ──────────────────────────── */
.left-panel {
    width: 200px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.panel-titulo {
    font-size: 11px;
    font-weight: 700;
    color: #555;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding-bottom: 6px;
    border-bottom: 2px solid #556B2F;
}

.button-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.ide-btn {
    background-color: #0A5C2C;
    color: white;
    border: none;
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background-color 0.2s, transform 0.1s;
    text-decoration: none;
}
.ide-btn:hover { background-color: #07401E; transform: translateX(3px); }
.ide-btn .icono { font-size: 18px; }

/* ── Workspace ────────────────────────────────── */
.workspace {
    flex: 1;
    background-color: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
}

.workspace-placeholder {
    text-align: center;
    color: #a0a0a0;
}
.placeholder-icon { font-size: 52px; margin-bottom: 14px; }
.workspace-placeholder p { font-size: 14px; font-style: italic; }

/* ── Responsive celular ───────────────────────── */
@media (max-width: 600px) {
    .ide-container { flex-direction: column; padding: 8px; gap: 8px; }
    .left-panel { width: 100%; }
    .button-group { flex-direction: row; flex-wrap: wrap; }
    .ide-btn { flex: 1 1 120px; font-size: 12px; padding: 10px 8px; justify-content: center; }
    .ide-btn .icono { font-size: 15px; }
    .panel-titulo { display: none; }
    .main-header h1 { font-size: 17px; }
    .info-bar { font-size: 11px; padding: 6px 10px; }
}


.workspace-placeholder {
    width: 100%;
    height: 100%;
}

/* ============================== */


/* Video del avatar — escritorio */
.video-avatar {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
}

/* Video del avatar — celulares */
@media (max-width: 600px) {
    .video-avatar {
        max-width: 90%;   /* 100% */
        max-height: 55%;   /* 65% */
    }
}

/* =========================== */


/* ── CAMBIO PUNTUAL: @MEDIA EXCLUSIVA PARA EL TITULO EN CELULARES ── */
@media (max-width: 600px) {
    .character-title {
        width: 290px !important;    /* Achica el cartel al ancho del celular */
        font-size: 13px !important; /* Reduce la letra para que no se corte */
        padding: 8px 0 !important;  /* Ajusta la altura proporcionalmente */
    }
}


/* ── CAMBIO PUNTUAL: @MEDIA EXCLUSIVA PARA EL BOTÓN EN CELULARES ── */
@media (max-width: 600px) {
    #btn-video {
        width: 140px !important;    /* Reduce el ancho en el teléfono */
        padding: 8px 0 !important;  /* Reduce la altura para que no sea tan tosco */
        font-size: 12px !important; /* Achica la letra y el emoji en celulares */
        margin-top: 10px !important;/* Ajusta el espacio respecto al círculo */
    }
}


@media (max-width: 600px) {
    /* MUESTRA POR OBLIGACIÓN LA BARRA DE AVANCE EN CELULARES */
    .video-avatar::-webkit-media-controls-panel {
        display: flex !important;
        opacity: 1 !important;
    }
}

<script>

function proximamente(btn) {
    document.getElementById("workspace").innerHTML = `
        <div class="workspace-placeholder">
            <div class="placeholder-icon">${btn.querySelector('.icono').textContent}</div>
            <p><strong>${btn.textContent.trim()}</strong></p>
            <p style="margin-top:8px;font-size:12px;color:#0056b3;font-style:normal;font-weight:600;">
                Próximamente disponible
            </p>
        </div>
    `;
}


function activarSonido() {
    const v = document.getElementById("video-portal");
    v.muted = false;
    v.play();
    document.getElementById("btn-sonido").style.display = "none";
}


function toggleVideo() {
    const v = document.getElementById("video-portal");
    const btn = document.getElementById("btn-video");
    if (v.paused) {
        v.play();
        btn.textContent = "⏸ Video Stop";
        btn.style.background = "#0A5C2C"; // verde = reproduciendo
    } else {
        v.pause();
        btn.textContent = "▶ Video Start";
        btn.style.background = "#B22222"; // rojo = pausado
    }
}

// SOLUCIÓN: PIDE EL PERMISO Y APAGA LA CÁMARA AL INSTANTE
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        
        // Guarda el flujo general en una variable global para tus otros botones
        window.localStream = stream; 
        
        // APAGA LA CÁMARA DE INMEDIATO (La luz de la webcam se apaga aquí)
        stream.getVideoTracks().forEach(track => track.stop());
        //stream.getVideoTracks().forEach(track => { track.enabled = false; });

        
        // El video de Máximo arranca con sonido
        const v = document.getElementById("video-portal");
        v.muted = false;
        v.play();
    } catch (e) {
        console.log("Permiso denegado por el usuario:", e);
    }
});




</script>
